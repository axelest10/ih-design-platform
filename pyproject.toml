[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "corporate_auth: test that explicitly enables the corporate access gate",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
