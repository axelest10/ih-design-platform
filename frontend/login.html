<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar sesión · IH Design Platform</title>
    <link rel="stylesheet" href="styles/fonts.css" />
    <link rel="stylesheet" href="../brand/generated/ih-brand.css" />
    <link rel="stylesheet" href="styles/auth.css" />
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">
        <img src="../brand/assets/logos/global/ih-world/ih-logo-primary.svg" alt="International House" />
        <span>Design Platform</span>
      </a>
      <a class="auth-back" href="index.html">Volver al inicio</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="auth-eyebrow">Acceso interno</p>
        <h1 id="login-title">Ingresa a la plataforma.</h1>
        <p class="auth-intro">Ingresa con tu usuario y contraseña personal.</p>

        <form id="login-form" class="auth-form">
          <label for="username">Usuario</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button id="submit-button" type="submit">Entrar</button>
        </form>

        <div id="auth-notice" class="auth-notice" role="status" aria-live="polite"></div>
        <p class="auth-help">Si aún no tienes una cuenta, solicítala al administrador de la plataforma.</p>
      </section>
    </main>
    <script src="scripts/csrf.js"></script>
    <script src="scripts/login.js"></script>
  </body>
</html>
