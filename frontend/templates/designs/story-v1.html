<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ headline }}</title>
    <style>
      :root { --ih-background: {{ background_hex }}; --ih-accent: {{ accent_hex }}; --ih-surface: {{ surface_hex }}; --ih-text: {{ text_hex }}; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--ih-background); }
      .ih-story-v1 { width: 1080px; height: 1920px; padding: 72px; background: var(--ih-background); font-family: "Open Sans", sans-serif; }
      .ih-story-v1__card { height: 1776px; padding: 48px; border-radius: 32px; background: var(--ih-surface); color: var(--ih-text); }
      .ih-story-v1__logo { display: block; width: 280px; height: 92px; object-fit: contain; object-position: left center; }
      .ih-story-v1__logo-row { display: flex; align-items: center; gap: 24px; min-height: 92px; }
      .ih-square-v1__secondary-logo { width: 160px; height: 72px; object-fit: contain; }
      .ih-story-v1__eyebrow { margin: 308px 0 16px; color: var(--ih-accent); font: 600 18px/28px "Open Sans", sans-serif; letter-spacing: .02em; text-transform: uppercase; }
      .ih-story-v1__headline { max-width: 820px; margin: 0; color: var(--ih-accent); font: 700 72px/1.1 Aptos, Arial, sans-serif; }
      .ih-story-v1__body { max-width: 760px; margin: 72px 0 0; font: 400 34px/1.4 "Open Sans", sans-serif; }
      .ih-story-v1__cta { display: inline-block; margin-top: 360px; padding: 18px 28px; border-radius: 999px; background: var(--ih-accent); color: var(--ih-surface); font: 600 24px/1.2 Aptos, Arial, sans-serif; }
    </style>
  </head>
  <body>
    <main class="ih-story-v1" data-template-key="story-v1" data-template-version="1.0.0">
      <section class="ih-story-v1__card" aria-labelledby="headline">
        <div class="ih-story-v1__logo-row"><img class="ih-story-v1__logo" src="{{ logo_data_uri }}" alt="{{ logo_alt }}" />{{ additional_logos_html }}</div>
        <p class="ih-story-v1__eyebrow">{{ eyebrow }}</p>
        <h1 id="headline" class="ih-story-v1__headline">{{ headline }}</h1>
        <p class="ih-story-v1__body">{{ body }}</p>
        <span class="ih-story-v1__cta">{{ cta }}</span>
      </section>
    </main>
  </body>
</html>
