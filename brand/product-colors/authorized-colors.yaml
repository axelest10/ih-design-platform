# brand/product-colors/authorized-colors.yaml
# Colores autorizados por producto/pilar de negocio de International House México.
#
# Fuente oficial confirmada por el cliente (2026-08-05): tabla "Sistema de Colores por Pilar"
# del documento IH_BRANDING_MARCA.docx (subido por el cliente), que coincide exactamente con
# IH_Mexico_Sistema_Diseno_Web.docx. Esta es la fuente única de verdad para este archivo.
#
# Descartadas como fuente para este archivo (documentadas solo como referencia/candidatas
# en la sección `alternate_sources_not_used` al final):
#   - IH_Sistema_Colores_v2.docx (divergía en 4 pilares; el cliente confirmó que
#     IH_Mexico_Sistema_Diseno_Web.docx / IH_BRANDING_MARCA.docx es la versión correcta)
#   - Color por producto.pdf (usa nombres de producto distintos — "Live!", "UP" — que no se
#     pudieron confirmar como equivalentes 1:1 a los 6 pilares oficiales)

version: "1.0.0"
status: approved
confirmed_by: "Axel Estrada, 2026-08-05"
confirmed_source: "IH_BRANDING_MARCA.docx (tabla 'Sistema de Colores por Pilar')"

pillars:
  ingles_general:
    display_name: "Inglés General"
    commercial_alias: "Hello!"
    alias_note: >
      Confirmado por el cliente (Axel Estrada, 2026-08-05): este pilar se comercializa
      actualmente como "Hello!" (antes "Live!" en `Color por producto.pdf`). Es un alias
      comercial del mismo pilar "Inglés General" — usa el mismo color institucional (Youth
      Green #B7DB6E), no una paleta propia. NOTA: existe material de marketing (deck "Hello
      Live English — Presentación Directores") que describe a "Hello Live English" con una
      identidad visual propia (paleta Navy/Cian/Verde/Naranja/Magenta/Morado, logo de burbuja
      de chat, tipografía Poppins, dominio helloliveenglish.com) separada de la paleta
      institucional de IH. Esa identidad NO se adopta aquí por decisión explícita del cliente:
      "Hello!" se trata como el mismo pilar de siempre con nombre comercial nuevo, usando
      Youth Green. Si en el futuro se decide adoptar la identidad visual independiente del
      deck, este archivo debe actualizarse explícitamente — no asumir la paleta separada por
      inferencia.
    primary_hex: "#B7DB6E"
    primary_token: youth
    secondary_hex: "#28AE62"
    secondary_token: green
    background_hex: "#F0FAF0"
    cta:
      background_hex: "#28AE62"
      text_hex: "#FFFFFF"
    sensation: "Fresca, accesible, dinámica"
    justification: "Verde joven transmite accesibilidad y oportunidad de crecimiento."

  cambridge:
    display_name: "Cambridge"
    primary_hex: "#923472"
    primary_token: technology
    secondary_hex: "#3B44B5"
    secondary_token: knowledge
    background_hex: "#F5EBF2"
    cta:
      background_hex: "#923472"
      text_hex: "#FFFFFF"
    sensation: "Académico, serio, distinguido"
    justification: "El magenta denota prestigio y certificación de alto nivel."

  university_programmes:
    display_name: "University Programmes"
    commercial_alias: "UP"
    alias_note: >
      Confirmado por el cliente (Axel Estrada, 2026-08-05): "UP" (de `Color por producto.pdf`)
      es el nombre corto/comercial de este mismo pilar "University Programmes", mismo color
      institucional (Knowledge Blue #3B44B5).
    primary_hex: "#3B44B5"
    primary_token: knowledge
    secondary_hex: "#F4CF80"
    secondary_token: joy
    background_hex: "#EEF0FF"
    cta:
      background_hex: "#3B44B5"
      text_hex: "#FFFFFF"
    sensation: "Confianza, global, aspiracional"
    justification: "Azul IH principal. Transmite credibilidad y apertura internacional."

  empresas:
    display_name: "Inglés para Empresas"
    primary_hex: "#28AE62"
    primary_token: green
    secondary_hex: "#B7DB6E"
    secondary_token: youth
    background_hex: "#EBF7F0"
    cta:
      background_hex: "#28AE62"
      text_hex: "#FFFFFF"
      note: "El documento fuente tiene una errata de tipeo ('#2BAE62'); se normaliza al token oficial green (#28AE62)."
    sensation: "Profesional, crecimiento, resultados"
    justification: "Verde asocia crecimiento empresarial y resultados medibles."

  ielts:
    display_name: "IELTS"
    primary_hex: "#E31736"
    primary_token: ielts_red
    primary_token_source: extended_colors
    secondary_hex: "#E070A2"
    secondary_token: pink
    background_hex: "#FFF0F0"
    cta:
      background_hex: "#E31736"
      text_hex: "#FFFFFF"
    sensation: "Urgente, enfocado, competitivo"
    justification: "Rojo IELTS oficial. Comunica urgencia y alto rendimiento."

  spanish_courses:
    display_name: "Spanish Courses"
    primary_hex: "#F4AB63"
    primary_token: light
    secondary_hex: "#923472"
    secondary_token: technology
    background_hex: "#FFF8F0"
    cta:
      background_hex: "#923472"
      text_hex: "#FFFFFF"
    sensation: "Cálido, cultural, auténtico"
    justification: "Ámbar evoca México, calidez cultural y experiencia auténtica."

rules:
  - "Cada pilar usa su color principal como color dominante en CTAs, hero overlays y acentos de marca."
  - "No mezclar el color principal de un pilar con el color principal de otro pilar en la misma pieza."
  - "El color de fondo (background_hex) es un tinte muy claro del color del pilar — no reemplazarlo por blanco puro ni por otro tinte no documentado."
  - "El texto sobre CTA de color siempre es blanco (#FFFFFF), salvo excepción documentada explícitamente."
  - "El rojo IELTS (#E31736) es una extensión confirmada exclusiva de México y NO forma parte de la paleta de 8 colores del manual global — no debe usarse fuera del pilar IELTS."

alternate_sources_not_used:
  - source: "IH_Sistema_Colores_v2.docx (Tabla 21)"
    status: superseded
    note: "Divergía de la fuente oficial en el color secundario/fondo de Cambridge, University Programmes, Empresas e IELTS. El cliente confirmó el 2026-08-05 que IH_Mexico_Sistema_Diseno_Web.docx / IH_BRANDING_MARCA.docx es la versión correcta."
  - source: "Color por producto.pdf"
    status: aliases_confirmed
    note: >
      Usa nombres de producto distintos a los 6 pilares oficiales: "Live!" (#B7DB6E),
      "Cambridge" (#923472), "UP" (#3B44B5), "Empresas" (#28AE62), "IELTS" (#e41836 —
      valor de rojo distinto al oficial #E31736), "Spanish Course" (#F4AB63). CONFIRMADO por
      el cliente el 2026-08-05: "Live!" (ahora renombrado "Hello!") = pilar "Inglés General";
      "UP" = pilar "University Programmes". Ambos son alias comerciales del mismo pilar y
      color institucional — ver `commercial_alias` en cada pilar arriba. El HEX de IELTS de
      este documento (#e41836) sigue sin usarse; el oficial confirmado es #E31736.
