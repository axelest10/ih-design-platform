# brand/assets/logos/manifest.yaml
#
# Catálogo de logotipos para International House LATAM y activos asociados.
# ESTADO ACTUAL: carga parcial: se incorporaron los archivos disponibles en Drive.
# Siguen pendientes las variantes IH white-reversed y dual-branding.
#
# Cuando se carguen los archivos de logo, cada entrada de `logos:` debe registrarse aquí con
# los campos definidos en `schema`. `backend/branding/services/validators.py::validate_logo` valida
# contra este archivo: cualquier logo cuyo `file` no esté listado aquí se considera NO
# APROBADO y debe ser rechazado por el sistema (ver validations en tests/test_branding_assets.py).

version: "2.0.0"
status: partial

schema:
  # Campos requeridos por cada entrada bajo `logos:`
  fields:
    - name          # nombre corto identificador, ej. "ih-mexico-classic"
    - variant       # classic | black | white | white-reversed | dual-branding
    - format        # svg | ai | png | jpg | eps
    - file          # ruta relativa dentro de brand/assets/logos/
    - allowed_backgrounds  # lista: white | knowledge-blue | photo-high-contrast
    - clear_space_rule     # referencia a documentation/logo-rules.md
    - approved      # true/false — true si el archivo fue provisto por el cliente
    - notes
  optional_fields:
    - scope         # core | regional | global | sub-brand | partner
    - brand         # marca representada por el archivo
    - country       # país o null si es global/partner
    - source_folder
    - source_file_id

expected_variants:
  # Basado en el manual oficial y los archivos disponibles en la carpeta LATAM compartida.
  # Esta lista documenta QUÉ se espera recibir, no activos ya cargados.
  - variant: classic
    description: "Logo a color — negro + Knowledge Blue. Uso por defecto sobre fondo blanco."
    formats_expected: [svg, ai, png]
  - variant: black
    description: "Logo monocromático negro. Uso de alto contraste sobre fondo blanco."
    formats_expected: [svg, ai, png]
  - variant: white
    description: "Logo monocromático blanco. Uso sobre fondo Knowledge Blue o fotografía oscura."
    formats_expected: [svg, ai, png]
  - variant: white-reversed
    description: "Variante blanca invertida, para fondos de color/foto con alto contraste."
    formats_expected: [svg, png]
  - variant: dual-branding
    description: "Lockup horizontal/vertical IH World + escuela, con barra separadora (80% de altura/longitud)."
    formats_expected: [svg, ai, png]

