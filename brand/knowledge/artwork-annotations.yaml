# brand/knowledge/artwork-annotations.yaml
#
# Capa de anotaciones semánticas (curadas) sobre las 454 referencias visuales. Es una fuente
# de verdad SEPARADA de brand/assets/artwork-references/manifest.yaml: el manifest documenta
# hechos técnicos crawleados de Drive (nombre, país, ruta, checksum); este archivo documenta
# juicios de selección (producto, pilar, composición, etc.) que un humano o un pase de análisis
# de imagen añade encima. Se fusiona con el manifest al generar
# brand/knowledge/artwork-reference-knowledge.json vía
# brand/scripts/build_design_knowledge.py (que ahora acepta --annotations).
#
# Ver brand/knowledge/artwork-annotation-schema.json para el vocabulario controlado completo.
#
# Orden de aplicación (cada capa sobreescribe la anterior):
#   1. default_annotation       — aplicado a los 454 assets.
#   2. heuristic_rules (en orden) — aplicado solo si `when` matchea.
#   3. overrides[asset_id]      — máxima prioridad; usado para los assets con revisión visual
#      humana real (ver `annotation_source: human-visual-review-2026-08-06`).
#
# IMPORTANTE: reuse_permission=client-authorized-reuse refleja la autorización general del
# cliente (2026-08-06) para reutilizar/tomar como referencia TODA la biblioteca — no implica
# que review.approval_status cambie a "approved"; eso sigue pendiente de revisión pieza por
# pieza (requires_human_approval se mantiene true).

version: "1.1.0"
status: partial
coverage_note: >
  454/454 assets reciben el default + heurísticas (cobertura completa de campos con valores
  conservadores). 40/454 (8 por país + 8 del grupo IELTS LATAM, tras dos pasadas el 2026-08-06)
  recibieron revisión visual humana real — siguen siendo una muestra de calibración ampliada, no
  cobertura total. El resto queda con annotation_status=metadata-only y needs_review=true hasta
  un pase de anotación más amplio (ver brand/knowledge/README.md).

default_annotation:
  product_slug: null
  product_status: null
  campaign_or_theme: null
  content_pillar: null
  audience: null
  funnel_stage: unknown
  visual_tags: []
  background_type: unknown
  composition_type: unknown
  layout_pattern: unknown
  image_subject: null
  people_count: null
  logo_present: null
  logo_placement: unknown
  logo_variant: null
  logo_scale: unknown
  headline_present: null
  headline_treatment: null
  supporting_text_present: null
  cta_present: null
  cta_treatment: null
  typography_style: null
  photo_style: null
  graphic_elements: []
  recommended_use: null
  reuse_permission: client-authorized-reuse
  annotation_status: metadata-only
  annotation_confidence: null
  annotation_source: "default-unannotated"
  needs_review: true

heuristic_rules:
  # Se evalúan en orden. `when` soporta: tag_contains (substring en cualquier tag del entry),
  # country / country_not (comparación exacta contra el país normalizado del asset).
  - id: layout-pattern-from-orientation-square
    when: { orientation: square }
    apply:
      layout_pattern: square-social-post
      annotation_source: "heuristic:orientation=square"

  - id: layout-pattern-from-orientation-portrait
    when: { orientation: portrait }
    apply:
      layout_pattern: portrait-social-post
      annotation_source: "heuristic:orientation=portrait"

  - id: ielts-latam-group
    when: { country: "ielts-latam" }
    apply:
      product_slug: ielts-preparation
      product_status: inferred
      content_pillar: ielts
      annotation_source: "heuristic:country=ielts-latam — confirmado por el cliente 2026-08-06 como la misma carpeta de marketing regional de ielts-preparation, no un producto distinto"
      annotation_confidence: high

  - id: ielts-tag-country-specific
    when: { tag_contains: "ielts", country_not: "ielts-latam" }
    apply:
      product_slug: ielts-preparation
      product_status: inferred
      content_pillar: ielts
      annotation_source: "heuristic:tag contains 'ielts' + country pillar (brand/knowledge/product-catalog.yaml#ielts-preparation)"
      annotation_confidence: medium

