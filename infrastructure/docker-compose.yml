services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ih_design
      POSTGRES_USER: ih_design
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
